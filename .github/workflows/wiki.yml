name: Publish Wiki

on:
  workflow_run:
    workflows: ["CI"] # Name of the first workflow
    types:
      - completed

permissions:
  contents: write

jobs:
  build-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone Wiki Repository
        run: |
          # The wiki is a separate git repository hosted alongside your main repo
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki-repo

      - name: Update Wiki Content
        run: |
          # Clear existing wiki files
          rm -rf wiki-repo/*
          
          # Copy your main documentation file and rename it to Home.md
          # Replace 'docs/index.md' with the actual filename of your main documentation file
          cp docs/Home.md wiki-repo/Home.md
          
          # Copy any other markdown files from docs/ (excluding the main one if it's there)
          # or copy class_docs as before
          mkdir -p wiki-repo/class_docs
          if [ -d "docs/class_docs" ] && [ "$(ls -A docs/class_docs)" ]; then
            cp -r docs/class_docs/* wiki-repo/class_docs/
          fi

      - name: Push to Wiki
        run: |
          cd wiki-repo
          git add .
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-update wiki from docs/ [skip ci]"
          git push origin master